[project]
name = "c360"
version = "1.0.0"
description = "Customer360 - Unified Customer Data & Personalization Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.9,<3",
    "structlog>=24.4,<25",
    "slowapi>=0.1.9,<0.2",
    "typer>=0.13,<0.14",
    "numpy>=1.26,<2.1",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5,<3.6",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["c360*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
