name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        working-directory: backend
        run: |
          pip install ruff mypy
      - name: Ruff
        working-directory: backend
        run: ruff check c360
      - name: Mypy (core modules)
        working-directory: backend
        run: mypy c360/schema c360/dq c360/identity c360/segments --ignore-missing-imports || true

  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: c360
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d c360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run Alembic migrations
        working-directory: backend
        env:
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
        run: alembic upgrade head
      - name: Create test admin user
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python -m c360.cli create-admin --email admin@c360.local --password Admin123!Pass
      - name: Run pytest (generator, DQ engine, identity resolution -- Spark local mode)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
      - name: npm audit (frontend dependencies)
        working-directory: frontend
        run: npm audit --omit=dev || true
