name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        working-directory: backend
        run: |
          pip install ruff mypy
      - name: Ruff
        working-directory: backend
        run: ruff check c360
      - name: Mypy (core modules)
        working-directory: backend
        run: mypy c360/schema c360/dq c360/identity c360/segments --ignore-missing-imports || true

  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16 = official postgres:16 + the pgvector
        # extension preinstalled -- needed for migration 0003_ai_knowledge
        # (the Customer360 Intelligence Assistant's document_chunks table).
        # Same env vars/ports as plain postgres:16; drop-in replacement.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: c360
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d c360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run Alembic migrations
        working-directory: backend
        env:
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
        run: alembic upgrade head
      - name: Create test admin user
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python -m c360.cli create-admin --email admin@c360.local --password Admin123!Pass
      - name: Generate + run pipeline (tiny profile, so API tests have real customer rows)
        # Pre-existing gap this CI file had before this commit: test_api.py's
        # customer/segment/analytics tests require at least one real
        # customer in Postgres, but no step ever loaded one. Using the
        # smallest generator profile ("tiny", 200 people) to keep this fast.
        # Note: run_pipeline connects via raw psycopg (not SQLAlchemy), which
        # does not understand the "+psycopg" dialect suffix used by the
        # other steps here -- it needs a plain postgresql:// URL.
        working-directory: backend
        run: |
          python -m c360.generator.main --seed 20260922 --size tiny --out-dir ../data --defect-profile default
          python -m c360.pipeline.run_pipeline --input-dir ../data/input --dataset-size tiny --database-url "postgresql://postgres:postgres@localhost:5432/c360"
          python -m c360.cli evaluate-segments --database-url "postgresql://postgres:postgres@localhost:5432/c360"
      - name: Ingest AI knowledge base (no LLM credential required)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python -m c360.cli ingest-ai-docs
      - name: Run pytest (generator, DQ engine, identity resolution, AI assistant -- Spark local mode)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c360
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
      - name: npm audit (frontend dependencies)
        working-directory: frontend
        run: npm audit --omit=dev || true
