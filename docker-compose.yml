services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: c360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - c360_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d c360"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/c360
    entrypoint: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      C360_ENV: local
      DATABASE_URL: postgresql+psycopg://c360_app:c360_app@postgres:5432/c360
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ENABLE_DOCS: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile.pipeline
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://c360_loader:c360_loader@postgres:5432/c360
    volumes:
      - ./data:/app/data
    profiles: ["pipeline"]  # run on demand: docker compose --profile pipeline run pipeline ...

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  c360_pgdata:
